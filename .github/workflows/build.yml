# Tests, then the app for Linux, Windows and macOS.
# Every push to main builds them; a tag like v0.2.0 also makes a GitHub release with them.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Tests
        run: cargo test --workspace

  app:
    name: App (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxkbcommon-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interface
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # `steam-fan` (what Steam runs for Play) goes inside the app as a sidecar
      - name: steam-fan
        shell: bash
        run: |
          cargo build --release -p steam-fan
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p crates/desktop/binaries
          cp "target/release/steam-fan$ext" "crates/desktop/binaries/steam-fan-$triple$ext"

      - name: Steam-Fan app
        shell: bash
        working-directory: crates/desktop
        run: npx --yes @tauri-apps/cli@^2 build --config tauri.bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: Steam-Fan-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # the notes list the commits and pull requests since the last release
          generate_release_notes: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
