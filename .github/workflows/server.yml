# Steam-Fan-Server's Docker image, published as ghcr.io/za0068/steam-fan-server.
# The NAS then only downloads it: `docker compose pull && docker compose up -d`.
name: Server image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/core/**"
      - "crates/server/**"
      - "docker/Dockerfile"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/za0068/steam-fan-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Steam-Fan-Server
            org.opencontainers.image.source=https://github.com/ZA0068/Steam-Fan
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
