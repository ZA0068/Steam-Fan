[package]
name = "steam-fan-core"
description = "Shelf (NAS) and box (PC) game library logic for Steam-Fan"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
crc32fast = "1"
sha2 = "0.10"
regex = "1"
walkdir = "2"
dirs = "5"
ureq = { version = "2", features = ["json"] }
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "ico", "tga", "bmp", "jpeg", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "lzma", "bzip2", "zstd"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
