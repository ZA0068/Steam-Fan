[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/desktop", "crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Zain"]

[profile.release]
opt-level = 3
strip = true
# smaller, faster programs; a little longer to build
lto = "thin"
codegen-units = 4
