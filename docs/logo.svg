<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Steam-Fan</title>
  <defs>
    <linearGradient id="blade" gradientUnits="userSpaceOnUse" x1="150" y1="150" x2="150" y2="30">
      <stop offset="0" stop-color="#0b2a5c"/>
      <stop offset="1" stop-color="#2a6bb3"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3a72b4"/>
      <stop offset="1" stop-color="#0a2250"/>
    </radialGradient>
    <!-- one blade pointing up; the others are the same blade turned 120 and 240 degrees -->
    <g id="arm">
      <!-- swept blade: wide at the hub, narrowing and bending toward the tip like a fan blade -->
      <path d="M 124 158
               C 104 128 100 96 116 70
               A 38 38 0 0 1 186 66
               C 170 92 168 118 176 140 Z" fill="url(#blade)"/>
      <!-- weight at the tip, with its bearing -->
      <circle cx="150" cy="62" r="36" fill="#002c64"/>
      <circle cx="150" cy="62" r="23" fill="#ffffff"/>
      <circle cx="150" cy="62" r="11" fill="#22366c"/>
    </g>
  </defs>
  <!-- moved down so the spinner sits in the middle of the square -->
  <g transform="translate(0 22)">
  <use xlink:href="#arm"/>
  <use xlink:href="#arm" transform="rotate(120 150 150)"/>
  <use xlink:href="#arm" transform="rotate(240 150 150)"/>
  <!-- hub -->
  <circle cx="150" cy="150" r="40" fill="#ffffff"/>
  <circle cx="150" cy="150" r="34" fill="url(#hub)"/>
  <circle cx="150" cy="150" r="19" fill="#ffffff"/>
  <circle cx="150" cy="150" r="9" fill="#002c64"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
